/* V0.3.1 compact mobile home: intentionally avoids double-sized cards and duplicate introductions. */
body{background:#f7f8fa}
.screen{padding:0 15px 96px;max-width:520px}
.top{height:60px}
.brand{gap:9px}.brandmark{width:31px;height:31px;border-radius:10px;font-size:16px;box-shadow:none}
.brandname{font-size:16px}.branddetail{display:none}.iconbtn{width:32px;height:32px;min-width:32px;border-radius:10px;font-size:16px}
.compact-intro{display:flex;justify-content:space-between;align-items:center;margin:3px 0 11px;gap:8px}
.compact-date{font-size:13px;font-weight:700;color:#576680}
.compact-demo{font-size:10px;color:#9ba7b5;white-space:nowrap}
.quickstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:white;border:1px solid #e5eaf1;border-radius:15px;padding:12px 4px;margin-bottom:15px}
.quickstat{padding:1px 9px;min-width:0}
.quickstat+.quickstat{border-left:1px solid #edf0f4}
.quickstat-label{font-size:10px;color:#8694a5;white-space:nowrap}
.quickstat-num{font-size:clamp(14px,4.6vw,21px);font-weight:800;margin-top:4px;line-height:1.24;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.quickstat-num.danger{color:#be4b52}.quickstat-num.success{color:#247c68}
.compact-sec{margin-top:12px}
.compact-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;min-height:23px}
.compact-head h2{font-size:15px;font-weight:800;margin:0;letter-spacing:-.3px}
.compact-head .minor{font-size:11px;color:#91a0b1}
.compact-head .linkbtn{padding:0;font-size:11px}
.compact-card{background:white;border:1px solid #e6ebf2;border-radius:13px;overflow:hidden}
.compact-task{display:flex;align-items:center;gap:9px;padding:10px 10px;min-height:66px}
.compact-task+.compact-task{border-top:1px solid #edf0f5}
.compact-task .bankicon{width:30px;height:30px;flex:0 0 30px;border-radius:9px;font-size:12px}
.compact-task-body{flex:1;min-width:0}
.compact-task-name{font-size:12px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-task-sub{font-size:10px;color:#95a0af;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-task-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:92px}
.compact-task-right strong{font-size:16px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.inline-action{padding:1px 0;color:#3565c1;font-weight:700;font-size:11px;background:none;border:0}
.inline-action:hover{text-decoration:underline}
.compact-alert{margin-top:7px;padding:8px 10px;background:#fff7ed;color:#a76736;border-radius:9px;font-size:11px}
.future-compact-summary{display:flex;align-items:baseline;gap:7px;padding:10px 12px 8px;font-size:11px;color:#8a98a8;border-bottom:1px solid #eef1f5;white-space:nowrap}
.future-compact-summary strong{font-size:16px;color:#293a51;margin-right:auto;white-space:nowrap}
.future-compact-summary .gap-num{color:#bf4e55;margin-left:2px}
.future-compact-summary .gap-num.ok{color:#228471}
.compact-day{display:grid;grid-template-columns:72px 1fr auto;gap:6px;align-items:center;padding:7px 12px;font-size:11px;min-height:32px}
.compact-day+.compact-day{border-top:1px solid #f1f3f7}
.compact-day .day-name{color:#53647c;font-weight:650;white-space:nowrap}
.compact-day .day-card{color:#8a97a8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compact-day strong{font-size:12px;font-weight:780;color:#26364c;white-space:nowrap;font-variant-numeric:tabular-nums}
.compact-day strong.no{color:#a7b0bf;font-weight:500}
.compact-offer{display:flex;align-items:center;gap:9px;padding:10px 11px;min-height:53px}
.compact-offer .miniicon{width:28px;height:28px;flex:0 0 28px;border-radius:9px;font-size:14px}
.compact-offer-main{flex:1;min-width:0}
.compact-offer-name{font-weight:750;font-size:12px}
.compact-offer-sub{font-size:10px;color:#8d9aab;margin-top:2px}
.compact-offer-money{text-align:right;min-width:78px}
.compact-offer-money strong{font-size:14px;white-space:nowrap}
.compact-offer-money small{display:block;font-size:10px;color:#c08b49;margin-top:2px}
.compact-fold{border-top:1px solid #edf0f4;padding:0 11px}
.compact-fold summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:11px;color:#6f8098}
.compact-fold summary::-webkit-details-marker{display:none}
.compact-fold summary::after{content:'⌄';font-size:14px;color:#7c90ab}
.compact-fold[open] summary::after{content:'⌃'}
.compact-fold-content{padding:0 0 11px;color:#8391a3;font-size:11px;line-height:1.6}
.compact-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 3px}
.compact-actions .bigbtn{padding:11px 5px;border-radius:11px;font-size:12px;box-shadow:none}
.bottomnav{padding-top:6px;padding-bottom:max(6px, env(safe-area-inset-bottom));box-shadow:0 -2px 13px #2938530b}
.navitem{gap:0;font-size:10px}.navglyph{font-size:18px}
.tinyfooter{font-size:10px;margin:13px 0 8px;line-height:1.4}
/* V0.3.3 keeps the compact accepted layout; due-date exceptions get minimal notices. */
.compact-task.missing{background:#fff9f4}
.compact-task.missing .compact-task-sub{color:#aa624f}
.compact-task.missing .compact-task-right strong{color:#ba5549}
.compact-task .late-tip{color:#b95951;font-weight:700}
.compact-alert{line-height:1.5}
.priority-note{margin-top:7px;font-size:11px;color:#a85e4d;line-height:1.45}
/* V0.3.2 hierarchy fix: highlight today's actual obligation, not idle cash. */
.quickstats{padding:7px 4px}
.quickstat{padding:7px 7px}
.quickstat.priority{background:#fff1ef;border-radius:10px;position:relative}
.quickstat.priority .quickstat-label{color:#ac4b43;font-weight:800}
.quickstat-num.priority-num{color:#a93836;font-weight:850;font-size:clamp(16px,4.8vw,23px)}
.quickstat-num.neutral-cash{color:#26354a!important;background:transparent!important;box-shadow:none!important;border:0!important;border-radius:0!important}
.quickstat.priority+.quickstat{border-left-color:transparent}
@media(min-width:650px){.screen{padding-left:18px;padding-right:18px}.quickstat-num{font-size:21px}}
@media(max-width:355px){.screen{padding-left:10px;padding-right:10px}.quickstat{padding-left:6px;padding-right:6px}.compact-task{gap:6px}.compact-day{grid-template-columns:62px 1fr auto;padding:7px 8px}}


/* V0.5 funding sequence: cash-only executable timeline */
.turnover-intro{padding:11px 12px 10px;background:#f7f9fc;border-bottom:1px solid #e9edf3;font-size:11px;color:#566986;line-height:1.55}
.turnover-intro strong{font-size:12px;color:#30445d}
.turnover-item{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-bottom:1px solid #f0f2f6}
.turnover-number{display:grid;place-items:center;flex:0 0 22px;height:22px;border-radius:8px;background:#eaf0fb;color:#4465aa;font-size:11px;font-weight:800}
.turnover-body{flex:1;min-width:0}.turnover-name{font-size:12px;font-weight:750;color:#293a50}
.turnover-desc{color:#8995a4;font-size:10px;margin-top:4px;line-height:1.5}
.turnover-value{font-size:12px;font-weight:800;white-space:nowrap;color:#314359;text-align:right}
.turnover-value .tag{display:block;font-size:10px;font-weight:650;color:#26826c;margin-top:4px}
.turnover-value .tag.need{color:#be5051}
.turnover-funding{padding:10px 12px;background:#fff8ef;color:#9a6738;font-size:11px;line-height:1.65;border-bottom:1px solid #f4ebdf}

<body>

<div class="tinyfooter">公开演示：全部虚构数据，不保存、不上传、不连接银行<br>请勿录入真实银行或财务信息；刷新页面自动重置</div>
</div>
<nav class="bottomnav" aria-label="页面导航"><button class="navitem active" data-tab="home"><span class="navglyph">⌂</span>今日提醒</button><button class="navitem" data-tab="cards"><span class="navglyph">▣</span>我的信用卡</button><button class="navitem" data-tab="plans"><span class="navglyph">▤</span>还款计划</button></nav>
<div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
<script>
'use strict';
const ZONE='Asia/Shanghai';
const formatMoney=n=>'¥'+(n/100).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2});
const yuan=n=>(n/100).toFixed(2);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bjToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:ZONE,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const niceDate=d=>{const a=d.split('-').map(Number);return a[1]+'月'+a[2]+'日'};
const cents=s=>{s=String(s).trim();if(!/^\d{1,9}(\.\d{1,2})?$/.test(s))throw Error('请输入非负金额，最多保留两位小数');const [a,b='']=s.split('.');const value=Number(a)*100+Number((b+'00').slice(0,2));if(!Number.isSafeInteger(value))throw Error('金额超出允许范围');return value;};
const displayNumber=n=>(n/100).toFixed(2);
let state,tab='home',baseDate=bjToday(),seq=0;
function seed(){baseDate=bjToday();seq=0;state={cash:1100000,reserved:0,estimated:[{id:'e1',date:addDays(baseDate,2),amount:400000,confirmed:false}],confirmed:[],cards:[{id:'cmb',name:'招商银行',last4:'1234',abbr:'招',cls:'cmb',outstanding:1400000,limit:800000,due:addDays(baseDate,6),cashOffer:0,cycleDay:23,dueOffsetDays:19,graceEligible:true},{id:'icbc',name:'工商银行',last4:'5678',abbr:'工',cls:'icbc',outstanding:900000,limit:600000,due:addDays(baseDate,3),cashOffer:0,cycleDay:22,dueOffsetDays:20,graceEligible:true,feeDisclosure:'listed',billedFeesCents:10000,feeItems:[{category:'利息',amountCents:10000}],statementDate:addDays(baseDate,-6)},{id:'citic',name:'中信银行',last4:'6092',abbr:'中',cls:'citic',outstanding:550000,limit:700000,due:addDays(baseDate,5),cashOffer:0,cycleDay:5,dueOffsetDays:20,graceEligible:true},{id:'ccb',name:'建设银行',last4:'2250',abbr:'建',cls:'ccb',outstanding:0,limit:550000,due:null,cashOffer:0,cycleDay:28,dueOffsetDays:20,graceEligible:true}],plans:[{id:'p1',card:'cmb',date:baseDate,amount:400000,paid:0},{id:'p2',card:'icbc',date:baseDate,amount:200000,paid:0},{id:'p3',card:'citic',date:addDays(baseDate,1),amount:300000,paid:0},{id:'p4',card:'icbc',date:addDays(baseDate,2),amount:500000,paid:0}],newDebt:0,events:[],cashOffer:{card:'ccb',limit:600000,net:500000,fee:10000,verified:false,eta:addDays(baseDate,1)}};tab='home';closeModal();render();}
const card=id=>state.cards.find(c=>c.id===id);
const pending=p=>Math.max(0,p.amount-p.paid);

// Synthetic monthly statement fees are within the existing billed total.
// Fee-first allocation is one scenario, not bank-confirmed restored credit.
// Unknown fees/credit posting must never be silently assumed to be zero.
function paymentFeeAllocation(cardId,amount){
 const c=card(cardId);
 if(!c||c.feeDisclosure!=='listed'||!Number.isSafeInteger(c.billedFeesCents))return null;
 if(!Number.isSafeInteger(amount)||amount<0)throw Error('本次还款金额无效');
 const previouslyAllocated=state.events.filter(e=>e.type==='repay'&&e.card===cardId).reduce((sum,e)=>sum+(e.feePortionCents||0),0);
 const feePortionCents=Math.min(amount,Math.max(0,c.billedFeesCents-previouslyAllocated));
 return {feePortionCents,otherPortionCents:amount-feePortionCents};
}
function restoredCreditEstimate(cardId){
 const c=card(cardId);
 if(c?.feeDisclosure!=='listed')return null;
 return state.events.filter(e=>e.type==='repay'&&e.card===cardId).reduce((total,e)=>
  total+(Number.isSafeInteger(e.creditReleaseEstimateCents)?e.creditReleaseEstimateCents:0),0);
}
const daysBetween=(a,b)=>Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000);
function cardCycle(c,asOf=baseDate){
 const d=new Date(asOf+'T12:00:00Z'),year=d.getUTCFullYear(),month=d.getUTCMonth();
 if(!Number.isInteger(c.cycleDay)||c.cycleDay<1||c.cycleDay>31||!Number.isInteger(c.dueOffsetDays)||c.dueOffsetDays<1||c.dueOffsetDays>45)return null;
 const at=(shift)=>{
   const first=new Date(Date.UTC(year,month+shift,1,12)),yy=first.getUTCFullYear(),mm=first.getUTCMonth(),end=new Date(Date.UTC(yy,mm+1,0,12)).getUTCDate();
   return yy+'-'+String(mm+1).padStart(2,'0')+'-'+String(Math.min(c.cycleDay,end)).padStart(2,'0');
 };
 // Conservative cycle assumption: if used on statement day, don't promise the new period.
 const statement=at(0)>asOf?at(0):at(1);
 const repayBy=addDays(statement,c.dueOffsetDays);
 return {statement,repayBy,days:daysBetween(asOf,repayBy),boundary:daysBetween(asOf,statement)<=1};
}
function cardCreditInfo(c){
 const verified=Number.isSafeInteger(c.checkedAvailableCents)&&c.checkedAvailableCents>=0;
 const cutoff=verified?(c.checkedEventCount??0):0;
 let amount=verified?c.checkedAvailableCents:c.limit,uncertain=false;
 for(const e of state.events.slice(cutoff).filter(e=>e.card===c.id)){
   if(e.type==='repay'){
     if(Number.isSafeInteger(e.creditReleaseEstimateCents))amount+=e.creditReleaseEstimateCents;
     else uncertain=true; // do not fabricate restored balance if fee/credit details are missing
   }
   if(e.type==='spend')amount-=e.amount;
 }
 return {amount:Math.max(0,amount),verified,uncertain,checkedDate:c.checkedDate??null,source:verified?'银行App人工核对':'演示预测'};
}
function availableCreditEstimate(c){return cardCreditInfo(c).amount;}
function chooseCardForToday(){
 return state.cards.map(c=>{
   const cycle=cardCycle(c),credit=cardCreditInfo(c);
   const overdue=!!(c.due&&c.due<baseDate&&c.outstanding>0);
   const eligible=!!cycle&&!!c.graceEligible&&!overdue&&credit.amount>0;
   return {id:c.id,cycle,credit,eligible};
 }).sort((a,b)=>Number(b.eligible)-Number(a.eligible)||(b.cycle?.days??0)-(a.cycle?.days??0)||a.id.localeCompare(b.id));
}
function chooseCardDisplay(){
 const ranked=chooseCardForToday(),top=ranked.find(x=>x.eligible);
 if(!top)return '<div class="choose-lead"><strong>暂时无法确定适合用哪张卡</strong><div class="choose-sub">先核对各卡账单日、实际可用额度及免息资格；不要直接根据授信额度安排消费。</div></div>';
 const c=card(top.id),p=top.cycle,cr=top.credit;
 const valid=cr.verified&&!cr.uncertain;
 const creditText=(valid?'已核对：':'估算：')+formatMoney(cr.amount);
 const cards=ranked.map((x,i)=>{
   const q=card(x.id),cycle=x.cycle,cred=x.credit;
   return '<div class="choose-row"><div><strong>'+q.name.replace('银行','')+' '+q.last4+'</strong>'+
    '<small>'+(cycle?'预计账单 '+niceDate(cycle.statement)+' · 预计到期 '+niceDate(cycle.repayBy):'账单日未设')+'</small>'+
    '<small>'+(x.eligible?cycle.days+'天（仅正常消费假设）':'暂不建议按免息期使用')+'</small></div>'+
    '<div class="choose-money">'+formatMoney(cred.amount)+'<small>'+(cred.verified&&!cred.uncertain?'银行App已核对 '+(cred.checkedDate||''):'估算／待核对')+'</small>'+
    '<button data-action="verify-credit" data-card="'+q.id+'">核对额度 ›</button><button data-action="edit-cycle" data-card="'+q.id+'" style="margin-left:6px">改账单日 ›</button></div></div>';
 }).join('');
 return '<section class="compact-sec" aria-label="今天用哪张卡"><div class="compact-head"><h2>今天用哪张卡？</h2><span class="minor">按免息周期排序</span></div>'+
  '<div class="compact-card"><div class="choose-lead"><div class="choose-head"><strong>'+c.name+' · '+c.last4+'</strong>'+
  '<span>优先核对</span></div><div class="choose-amount">'+creditText+'</div>'+
  '<div class="choose-sub">按虚构账单日 '+c.cycleDay+'号推算：今天正常消费，预计 <b>'+niceDate(p.repayBy)+'</b> 前全额还款，约 '+p.days+' 天。'+
  (p.boundary?'临近账单日，入账跨期可能改变日期。':'')+
  (!valid?'额度没有得到银行实时确认，请先核对。':'已核对额度只代表上次核对时点，后续变化是估算。')+
  '</div></div>'+
  '<div class="choose-buttons"><button class="primary" data-action="verify-credit" data-card="'+c.id+'">核对实际额度</button>'+
  '<button data-action="record-spend" data-card="'+c.id+'">记录真实消费</button></div>'+
  '<details class="next-details"><summary>其他信用卡及免息日排序</summary><div class="choose-grid">'+cards+'</div></details>'+
  '<div class="choose-note"><b>注意：</b>这只针对真实、符合银行规则的普通消费，且需满足该卡免息资格及到期全额还款条件。银行取现或现金借款一般不享受消费免息期；消费额度不能用来填补上面的还款现金缺口。</div></div></section>';
}
const scheduledToday=()=>state.plans.filter(p=>p.date<=baseDate&&pending(p)>0);
const totalToday=()=>scheduledToday().reduce((s,p)=>s+pending(p),0);
const futurePlans=()=>state.plans.filter(p=>p.date>baseDate&&p.date<=addDays(baseDate,3)&&pending(p)>0);
const sumPlans=x=>x.reduce((s,p)=>s+pending(p),0);
// A card bill falling due is still an obligation even if part of it was not scheduled.
// Pending plans dated AFTER the bank due date do not satisfy the on-time bill.
function uncoveredDue(){return state.cards.filter(c=>c.due&&c.outstanding>0&&c.due<=addDays(baseDate,3)).map(c=>{
  const planned=state.plans.filter(p=>p.card===c.id&&p.date<=c.due).reduce((sum,p)=>sum+pending(p),0);
  return {card:c.id,bankDue:c.due,date:c.due<baseDate?baseDate:c.due,amount:Math.max(0,c.outstanding-planned)};
}).filter(x=>x.amount>0)};

const activeCash=()=>Math.max(0,state.cash-state.reserved);
const confirmedBefore=d=>state.confirmed.filter(f=>f.date===d).reduce((s,f)=>s+f.amount,0);
const debt=()=>state.cards.reduce((s,c)=>s+c.outstanding,0)+state.newDebt;
function calcFuture(includeEstimate=false){let budget=activeCash(),gapToday=0,gap=0;const uncovered=uncoveredDue();for(let n=0;n<=3;n++){
const day=addDays(baseDate,n);
const scheduled=state.plans.filter(p=>(n===0?p.date<=day:p.date===day)).reduce((s,p)=>s+pending(p),0);
const bankDue=uncovered.filter(x=>x.date===day).reduce((s,x)=>s+x.amount,0);
const need=scheduled+bankDue;
if(includeEstimate)budget+=[...state.confirmed,...state.estimated].filter(f=>f.date===day).reduce((s,f)=>s+f.amount,0);
const missing=Math.max(0,need-budget);budget=Math.max(0,budget-need);
if(n===0)gapToday=missing;else gap+=missing;
}return {gapToday,gap,remaining:budget};}

const projectedAfterToday=()=>Math.max(0,activeCash()-totalToday()-uncoveredDue().filter(a=>a.date===baseDate).reduce((s,a)=>s+a.amount,0));
function htmCardIcon(c){return `<span class="bankicon ${c.cls}">${c.abbr}</span>`}

// Step order is calculated exclusively from existing bank bills and repayment plans.
// Expected or unverified sources never release a cash-constrained step.
function turnoverTimeline(){
 const end=addDays(baseDate,3);
 const items=[
   ...state.plans.filter(p=>pending(p)>0&&p.date<=end).map((p,i)=>({
     id:p.id,card:p.card,date:p.date<baseDate?baseDate:p.date,amount:pending(p),
     kind:'plan',sort:i,originalDate:p.date
   })),
   ...uncoveredDue().filter(a=>a.date<=end).map((a,i)=>({
     id:'due-'+a.card,card:a.card,date:a.date,amount:a.amount,
     kind:'unplanned',sort:100+i,originalDate:a.bankDue
   }))
 ].sort((a,b)=>a.date.localeCompare(b.date)||a.sort-b.sort);
 let available=activeCash();
 return items.map((x,i)=>{
   const before=available;
   const missing=Math.max(0,x.amount-before);
   available=Math.max(0,before-x.amount);
   return {...x,step:i+1,before,after:available,missing};
 });
}
function turnoverItem(row){
 const c=card(row.card),isToday=row.date<=baseDate;
 const d=isToday?'今天':row.date===addDays(baseDate,1)?'明天':row.date===addDays(baseDate,2)?'后天':'第3天';
 const label=row.kind==='unplanned'?'账单到期补足':'分批还款';
 const paid=state.plans.find(p=>p.id===row.id)?.paid||0;
 const detail=row.kind==='unplanned'?'银行到期 '+niceDate(row.originalDate)+' · 尚未安排':'已排 '+niceDate(row.originalDate)+(paid?' · 已还 '+formatMoney(paid):'');
 const action=row.kind==='unplanned'
   ?'<button class="inline-action" data-action="newplan" data-card="'+c.id+'" data-date="'+row.date+'">补计划 ›</button>'
   :'<button class="inline-action" data-action="repay" data-id="'+row.id+'">记已还 ›</button>';
 const status=row.missing>0?'<span class="tag need">前置缺口 '+formatMoney(row.missing)+'</span>'
   :'<span class="tag">'+(isToday?'当前现金可覆盖':'按现有现金可覆盖')+'</span>';
 return '<div class="turnover-item"><span class="turnover-number">'+row.step+'</span><div class="turnover-body"><div class="turnover-name">'+d+' · '+c.name.replace('银行','')+' '+c.last4+' · '+label+'</div><div class="turnover-desc">'+detail+' · '+action+'</div></div><div class="turnover-value">'+formatMoney(row.amount)+status+'</div></div>';
}

function turnoverHistory(){
 const rows=state.events.filter(e=>e.date===baseDate&&(e.type==='income'||e.type==='loan'||e.type==='repay')).slice(-4);
 if(!rows.length)return '';
 const types={income:'经营／自有资金',own:'自有资金',bankloan:'银行正规借款',otherloan:'其他合法借款'};
 const parts=rows.map(e=>e.type==='repay'
  ?'已还 '+(card(e.card)?.name.replace('银行','')||'某卡')+' '+formatMoney(e.amount)
  :'已到账 '+(types[e.source]||types[e.type]||'已确认资金')+' '+formatMoney(e.net)+(e.type==='loan'?'（新增债务 '+formatMoney(e.debt)+(e.fee?'，费用 '+formatMoney(e.fee):'')+'）':'')
 );
 return '<div class="turnover-history"><b>今日已执行：</b>'+parts.join('；')+'。页面将按实际净到账与实际还款重算后续步骤。</div>';
}
function turnoverForecastRows(){
 const funds=[...state.confirmed.map(f=>({...f,level:'已确认但未到账'})),...state.estimated.map(f=>({...f,level:'仅预计'}))]
   .filter(f=>f.amount>0&&f.date>baseDate&&f.date<=addDays(baseDate,3));
 if(!funds.length)return '';
 return funds.map(f=>'<div class="turnover-source fcast"><span class="miniicon blue">⌁</span><div class="info"><div class="name">已登记未来资金 · '+niceDate(f.date)+'</div><div class="sub">'+(f.source||'来源未指定')+' · '+f.level+'，未实际到账，周转执行顺序不依赖这笔钱</div></div><div class="op"><strong>'+formatMoney(f.amount)+'</strong><button class="inline-action" data-action="futurefund">调整计划 ›</button></div></div>').join('');
}

function turnoverFundingSummary(rows){
 const gaps=rows.filter(x=>x.missing>0);
 if(!gaps.length)return '<div class="turnover-funding" style="background:#f0f8f5;color:#267d67">当前现金可覆盖未来3天已知还款；无需假设新增资金。</div>';
 const first=gaps[0],c=card(first.card);
 const date=first.date===baseDate?'今天':first.date===addDays(baseDate,1)?'明天':first.date===addDays(baseDate,2)?'后天':'第3天';
 const total=gaps.reduce((s,x)=>s+x.missing,0);
 return '<div class="turnover-funding">资金接力节点：<strong>'+date+' '+c.name.replace('银行','')+'还款前至少补 '+formatMoney(first.missing)+'</strong>'+
   (total>first.missing?'；后续还需 '+formatMoney(total-first.missing):'')+
   '。合计缺口 '+formatMoney(total)+'。<br>仅实际净到账登记后才计入下一笔；报价与额度均未计入。</div>';
}


function quickNextAction(){
 const rows=turnoverTimeline();
 const todayRows=rows.filter(x=>x.date<=baseDate);
 const todayNeed=todayRows.reduce((s,x)=>s+x.amount,0);
 const afterToday=Math.max(0,activeCash()-todayNeed);
 const future=rows.filter(x=>x.date>baseDate);
 const shortfalls=future.filter(x=>x.missing>0);
 const first=shortfalls[0];
 const total=shortfalls.reduce((s,x)=>s+x.missing,0);
 const cardName=first?card(first.card).name.replace('银行',''):'';
 const when=first?(first.date===addDays(baseDate,1)?'明天':first.date===addDays(baseDate,2)?'后天':'第3天'):'';
 return {todayNeed,afterToday,firstMissing:first?.missing||0,firstCard:cardName,when,total,later:Math.max(0,total-(first?.missing||0)),todayCount:todayRows.length,
   todayShort:rows.filter(x=>x.date===baseDate).reduce((s,x)=>s+x.missing,0)};
}
function nextActionContent(){
 const x=quickNextAction();
 const today=x.todayNeed?'<div class="next-focus"><div class="title">第1件事：先完成上面的今日还款</div><div class="desc">今天还需 '+formatMoney(x.todayNeed)+'，不用在这里重复操作；直接点上面每张卡的「记录还款」。</div></div>'
  :'<div class="next-focus"><div class="title">今天的还款已经处理完</div><div class="desc">下方显示下一笔预计要准备的资金。</div></div>';
 const balance='<div class="next-cash"><span>今天的待还都付完，预计还能用</span><strong>'+formatMoney(x.afterToday)+'</strong></div>';
 const gap=x.todayShort>0
   ?'<div class="next-priority"><strong>先补今天的现金 '+formatMoney(x.todayShort)+'</strong>，否则今天的待还无法全部支付。收到钱后再点「我收到钱了」。</div>'
   :x.total>0
      ?'<div class="next-priority"><strong>接下来：'+x.when+'还'+x.firstCard+'之前，要再准备 '+formatMoney(x.firstMissing)+'</strong>'+
       (x.later?'；再往后还要准备 '+formatMoney(x.later):'')+'。<br>钱没到账前，先不要把它算进可用现金。</div>'
      :'<div class="next-priority clear"><strong>接下来3天已知的还款，现有现金可以覆盖。</strong> 未核实的资金暂时不用考虑。</div>';
 return today+balance+gap;
}

function renderCards(){return `<div class="tabhead"><h2>我的信用卡</h2><p>每张卡的账单日、预计还款日、可用消费额度都能在这里核对。</p></div><div class="rowlist subpage">${state.cards.map(c=>`<div class="subitem"><div style="display:flex;align-items:center;gap:10px">${htmCardIcon(c)}<div><strong>${c.name} · ${c.last4}</strong><p>本期到期日 ${c.due?niceDate(c.due):'暂无已出账'}</p></div></div><div style="text-align:right"><div class="num">${formatMoney(c.outstanding)}</div><div class="muted" style="font-size:10px;margin-top:4px">账单剩余</div><div style="font-size:10px;margin-top:4px;color:#597a9a">${cardCreditInfo(c).verified?`上次核对 ${formatMoney(cardCreditInfo(c).amount)} · ${cardCreditInfo(c).checkedDate||''}`:`预计可用 ${formatMoney(cardCreditInfo(c).amount)} · 待银行核对`}</div>${c.feeDisclosure==='listed'?`<div style="font-size:10px;color:#8a98a7;margin-top:3px">虚构月账单已列利息/费用 ${formatMoney(c.billedFeesCents)}（包含在账单内）</div>`:''}<div style="font-size:10px;margin-top:4px;color:#8595a9">${cardCycle(c)?`下次账单 ${niceDate(cardCycle(c).statement)} · 预计还款 ${niceDate(cardCycle(c).repayBy)}（正常消费）`:'账单周期待填写'}</div><button class="inline-action" data-action="verify-credit" data-card="${c.id}">核对额度 ›</button><button class="inline-action" data-action="edit-cycle" data-card="${c.id}" style="margin-left:8px">账单日期 ›</button></div></div>`).join('')}</div><div class="morebox"><div class="moretitle">当前账面债务 ${formatMoney(debt())}</div><div class="moredetail">排名按本演示的账单日和银行规定的预计到期日模拟；各卡最新实际可用额度、免息资格、交易入账时间要以银行App及官方账单核实。消费额度不是现金，也不能直接填补还款缺口。</div></div><div class="actionbar"><button class="bigbtn" data-action="cash">修改现金</button><button class="bigbtn primary" data-action="fund">记录实际到账</button></div>`;}
function renderPlans(){const plans=[...state.plans].sort((a,b)=>a.date.localeCompare(b.date));return `<div class="tabhead"><h2>分批还款计划</h2><p>调整后，首页“今天”和未来3天会同步变化。</p></div><div class="rowlist subpage"><div class="smallhead">已经安排的还款</div>${plans.map(p=>{const c=card(p.card);return `<div class="planitem"><div><strong>${niceDate(p.date)} · ${c.name} ${c.last4}</strong><p>计划 ${formatMoney(p.amount)} · 已还 ${formatMoney(p.paid)}</p></div><div style="text-align:right"><strong>${formatMoney(pending(p))}</strong><p><span class="statuspill ${pending(p)===0?'done':''}">${pending(p)===0?'已记录完成':'待执行'}</span></p></div></div>`;}).join('')}</div><div class="actionbar"><button class="bigbtn primary" data-action="newplan">＋ 新增还款计划</button><button class="bigbtn" data-action="fund">记录实际资金到账</button></div><div class="morebox"><div class="moretitle">提醒怎么计算？</div><div class="moredetail">以你确认的分批计划作为提醒依据。今天的金额不会重复算入未来3天；实际还款会扣减计划和本期账单，预计资金不会提前入账。</div></div>`;}
function render(){if(bjToday()!==baseDate)baseDate=bjToday();document.getElementById('main').innerHTML=tab==='home'?renderHome():tab==='cards'?renderCards():renderPlans();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function modal(title,subtitle,body,submitText='确认',onSubmit=()=>{}){document.getElementById('modalRoot').innerHTML=`<div class="modalbg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal"><div class="modalhead"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="close" data-action="close" aria-label="关闭">×</button></div><form id="modalform">${body}<div id="formMsg" role="status"></div><button class="primaryfull" type="submit">${esc(submitText)}</button><button class="secondaryfull" type="button" data-action="close">取消</button></form></div></div>`;document.getElementById('modalform').addEventListener('submit',e=>{e.preventDefault();try{onSubmit(new FormData(e.currentTarget))}catch(err){document.getElementById('formMsg').innerHTML=`<div class="error">${esc(err.message||'操作失败')}</div>`}});const focus=document.querySelector('#modalform input,#modalform select');if(focus)focus.focus({preventScroll:true});}
function moneyField(id,label,value,detail=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(value)}" required>${detail?`<div class="fieldsmall">${detail}</div>`:''}</div>`}
function todayRepay(pid){
 const p=state.plans.find(x=>x.id===pid);if(!p)return;
 const c=card(p.card),remain=pending(p),statementFees=c.feeDisclosure==='listed';
 const feeHint=statementFees
  ?'<div class="warntext">本卡虚构月账单已列费用 '+formatMoney(c.billedFeesCents)+'（已经包含在账单总额内，不必再输入或额外扣除）。按“费用先抵扣”的演示口径分配这次还款；银行实际恢复额度仍要核实。</div>'
  :'<div class="warntext">暂未识别出本卡账单的息费明细。本次只记录实际还款，不能假设费用为0或可用额度已即时恢复。</div>';
 modal('记录实际还款',c.name+' · '+c.last4+' · 本次待还 '+formatMoney(remain),
   moneyField('amount','这次实际还了多少（元）',displayNumber(remain),'只填写实际还款金额；本期账单已有的费用不需要重复填写。')+
   feeHint+'<div class="note">还款后消费额度恢复时间与金额因银行而异，不能算作手里到账现金。</div>',
   '确认已还',data=>{
     const n=cents(data.get('amount'));
     if(n<=0||n>remain||n>c.outstanding)throw Error('实际还款金额超出本次待还');
     if(n>activeCash())throw Error('当前可动用现金不足，请先核实实际到账');
     const allocation=paymentFeeAllocation(c.id,n);
     p.paid+=n;c.outstanding-=n;state.cash-=n;
     state.events.push({type:'repay',card:c.id,amount:n,date:baseDate,
       feePortionCents:allocation?.feePortionCents??null,
       otherPortionCents:allocation?.otherPortionCents??null,
       creditReleaseEstimateCents:allocation?.otherPortionCents??null
     });
     closeModal();render();
     toast('已还 '+formatMoney(n)+(allocation?' · 账单费用分配 '+formatMoney(allocation.feePortionCents):'')+' · 额度恢复待银行核实');
   });
}


function editCardCycle(cardId){
 const c=card(cardId);if(!c)return;
 modal('调整账单周期',c.name+' · '+c.last4+'。请以银行App或正式账单上的日期为准。',
  '<div class="field"><label for="cycleDay">每月账单日（1至31号）</label><input id="cycleDay" name="cycleDay" type="number" min="1" max="31" step="1" value="'+c.cycleDay+'" required></div>'+
  '<div class="field"><label for="dueOffsetDays">账单日后约几天是最后还款日</label><input id="dueOffsetDays" name="dueOffsetDays" type="number" min="1" max="45" step="1" value="'+c.dueOffsetDays+'" required></div>'+
  '<div class="field"><label for="grace">本卡普通消费免息资格</label><select id="grace" name="grace">'+
  '<option value="yes" '+(c.graceEligible===true?'selected':'')+'>银行已确认可按正常消费免息规则使用</option>'+
  '<option value="unknown" '+(c.graceEligible===null?'selected':'')+'>尚未核实，暂不推荐</option>'+
  '<option value="no" '+(c.graceEligible===false?'selected':'')+'>当前不符合免息条件，暂不推荐</option></select></div>'+
  '<div class="warntext">这里只是按银行账单周期估算下一账单和到期日。节假日、交易入账时间、临时额度和银行政策可能改变实际日期；还款必须按银行App实际账单执行。</div>',
  '保存周期',d=>{
    const day=Number(d.get('cycleDay')),offset=Number(d.get('dueOffsetDays')),grace=d.get('grace');
    if(!Number.isInteger(day)||day<1||day>31)throw Error('账单日必须为1至31号');
    if(!Number.isInteger(offset)||offset<1||offset>45)throw Error('请输入正确的还款间隔天数');
    if(!['yes','no','unknown'].includes(grace))throw Error('请选择免息资格状态');
    c.cycleDay=day;c.dueOffsetDays=offset;c.graceEligible=grace==='unknown'?null:grace==='yes';
    closeModal();render();toast(c.name.replace('银行','')+'账单周期已更新，推荐顺序已重算');
  });
}

function verifyCredit(cardId){
 const c=card(cardId);if(!c)return;
 modal('核对信用卡可用额度',c.name+' · '+c.last4+'。从银行App查看后填入，不用提交截图。',
  moneyField('available','银行App当前可用消费额度（元）',displayNumber(cardCreditInfo(c).amount))+
  '<div class="warntext">这是消费可用额度，不是提现额度。手动核对后将以此为新的预测起点，已经记录的还款/消费不会再重复加减。</div>',
  '保存核对金额',d=>{
   const n=cents(d.get('available'));
   c.checkedAvailableCents=n;c.checkedEventCount=state.events.length;c.checkedDate=baseDate;
   closeModal();render();toast('已核对 '+c.name.replace('银行','')+'消费额度 '+formatMoney(n));
  });
}
function recordSpend(cardId){
 const c=card(cardId);if(!c)return;
 const cr=cardCreditInfo(c),cycle=cardCycle(c);
 if(!cycle||!c.graceEligible||(c.due&&c.due<baseDate&&c.outstanding>0))return toast('本卡免息条件尚未确认，请先核对银行账单');
 modal('记录普通真实消费',c.name+' · '+c.last4+'（演示仅虚构金额）',
   moneyField('amount','这次真实消费金额（元）','500.00')+
   '<div class="warntext">当前'+(cr.verified?'已核对/后续估算':'未核实预测')+'可用额度 '+formatMoney(cr.amount)+'。录入后减少可用消费额度、增加未出账负债，不增加现金。消费是否免息以银行实际记账与全额还款为准。</div>',
   '记录消费',d=>{
    const amount=cents(d.get('amount'));
    const avail=cardCreditInfo(c);
    if(amount<=0||amount>avail.amount)throw Error('消费金额不能超过当前可用额度预测，请先核对银行App');
    state.events.push({type:'spend',card:c.id,amount,date:baseDate});
    state.newDebt+=amount;
    closeModal();render();toast('消费 '+formatMoney(amount)+' 已记录；可用额度和未出账负债已更新');
   });
}

function cashEdit(){modal('修改当前资金','只需要输入现在真正可用的金额，不必交代来源。',`${moneyField('cash','当前实际现金（元）',displayNumber(state.cash))}${moneyField('reserved','其中要预留不用的金额（元）',displayNumber(state.reserved))}<div class="warntext">现金按已统计账户的总额核对；账户之间转账不算新增资金。未来预计到账不会自动记为已收到。</div>`,'更新资金',d=>{const cash=cents(d.get('cash')),reserved=cents(d.get('reserved'));if(reserved>cash)throw Error('预留金额不能超过当前实际现金');state.cash=cash;state.reserved=reserved;closeModal();render();toast('现金预算已更新');});}
function futureFundModal(){
const x=state.estimated[0]||state.confirmed[0]||{date:addDays(baseDate,2),amount:0};const confirmed=state.confirmed.length>0;
modal('设置未来资金','这笔钱什么时候能用、是否已经确定，会影响后续三天缺口。',`<div class="field"><label for="date">预计可使用日期</label><input type="date" id="date" name="date" min="${addDays(baseDate,1)}" max="${addDays(baseDate,90)}" value="${x.date}" required></div>${moneyField('amount','将到账的净金额（元）',displayNumber(x.amount))}<div class="field"><label for="source">预计资金来源</label><select name="source" id="source"><option value="经营回款">经营回款</option><option value="此前未计入的自有资金">此前未计入的自有资金</option><option value="正规借款待放款">正规借款待放款</option></select></div><div class="field"><label for="certainty">确定程度</label><select name="certainty" id="certainty"><option value="estimate" ${confirmed?'':'selected'}>只是预计：保守测算不算入</option><option value="confirmed" ${confirmed?'selected':''}>已确认将到账：在指定日期计入预测</option></select></div><div class="warntext">即使选择“已确认将到账”，这笔款也不会立刻进入当前现金。当天真正到账后仍要通过“记录实际到账”单独确认，避免重复统计。</div>`,'保存未来资金',d=>{const amount=cents(d.get('amount')),date=d.get('date');if(!date||date<=baseDate||date>addDays(baseDate,90))throw Error('请选择未来90天内的日期');state.estimated=[];state.confirmed=[];if(amount>0){const x={id:'future1',date,amount,source:d.get('source')||'来源未指定'};if(d.get('certainty')==='confirmed')state.confirmed=[x];else state.estimated=[x];}closeModal();render();toast('未来资金已更新，3天缺口重新计算');});}
function newPlan(prefCard='',prefDate=''){const opts=state.cards.filter(c=>c.outstanding>0).map(c=>`<option value="${c.id}" ${c.id===prefCard?'selected':''}>${c.name} · ${c.last4} · 剩余${formatMoney(c.outstanding)}</option>`).join('');modal('新增一笔分批还款','安排好后会自动出现在对应日期的首页提醒。',`<div class="field"><label for="card">选择信用卡</label><select id="card" name="card">${opts}</select></div><div class="field"><label for="date">计划还款日期</label><input type="date" id="date" name="date" value="${prefDate||addDays(baseDate,1)}" min="${baseDate}" required></div>${moneyField('amount','计划还款金额（元）','1000.00')}<div class="warntext">这里创建的是你打算执行的还款计划，不等于已经还款或银行已确认入账。</div>`,'添加到还款计划',d=>{const c=card(d.get('card'));if(!c)throw Error('请选择信用卡');const amount=cents(d.get('amount'));if(amount===0)throw Error('还款金额须大于0');const date=d.get('date');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<baseDate||new Date(date+'T12:00:00Z').toISOString().slice(0,10)!==date)throw Error('请输入有效的未来日期');const allocated=state.plans.filter(p=>p.card===c.id).reduce((s,p)=>s+pending(p),0);if(allocated+amount>c.outstanding)throw Error('该卡剩余账单不足以支持更多计划，请先调整现有安排');state.plans.push({id:'p'+(++seq+10),card:c.id,date,amount,paid:0});closeModal();render();toast('新还款计划已添加');});}
function planOptions(){modal('调整还款安排','选择要修改的计划。已记录的还款不会被删掉。',`<div class="actionslist">${state.plans.map(p=>{const c=card(p.card);return `<button class="smallaction" type="button" data-action="editplan" data-id="${p.id}"><span>${niceDate(p.date)} · ${c.name} ${c.last4}<br><span class="muted">已执行 ${formatMoney(p.paid)}</span></span><strong>${formatMoney(pending(p))} ›</strong></button>`}).join('')}</div><button type="button" class="secondaryfull" data-action="newplan">＋ 新增一笔</button>`,'关闭',()=>closeModal());}
function editPlan(pid){const p=state.plans.find(x=>x.id===pid);if(!p)return;const c=card(p.card);modal('修改分批还款',`${c.name} · ${c.last4} · 已还 ${formatMoney(p.paid)}`,`<div class="field"><label for="date">执行日期</label><input type="date" name="date" id="date" value="${p.date}" min="${baseDate}" required></div>${moneyField('amount','更新后的整笔计划金额（元）',displayNumber(p.amount),'不能低于已经记录的实际还款。')}<div class="warntext">已记录的历史还款不受本次计划修改影响。修改日期后会重新计算首页每日提醒。</div>`,'保存计划',d=>{const date=d.get('date'),amount=cents(d.get('amount'));if(date<baseDate||!/^\d{4}-\d{2}-\d{2}$/.test(date)||new Date(date+'T12:00:00Z').toISOString().slice(0,10)!==date)throw Error('请输入有效的日期');if(amount<p.paid||amount===0)throw Error('计划不能低于已还金额，且必须大于0');const other=state.plans.filter(x=>x.card===c.id&&x.id!==p.id).reduce((s,x)=>s+pending(x),0);if(other+(amount-p.paid)>c.outstanding)throw Error('所有计划待还金额不能超过该卡剩余账单');p.date=date;p.amount=amount;closeModal();render();toast('计划已更新，首页提醒同步刷新');});}
function offerModal(){const o=state.cashOffer;modal('录入银行现金服务报价','这里仅记录经你核实的银行正规现金产品报价。',`<div class="warntext">示例卡：建设银行 · 2250。普通消费额度不能直接当可到账现金。录入报价不会自动增加现金，也不会替你申请。</div>${moneyField('net','预计净到手金额（元）',o.net===null?'5000.00':displayNumber(o.net))}${moneyField('fee','银行告知的手续费（元）',o.fee===null?'0.00':displayNumber(o.fee))}<div class="field"><label for="date">银行告知的预计到账日期</label><input name="date" id="date" type="date" min="${baseDate}" value="${o.eta||addDays(baseDate,1)}" required></div><div class="field"><label for="verified">报价来源</label><select name="verified" id="verified"><option value="0">仅测试假设</option><option value="1">本人已核实银行官方报价</option></select></div>`,'保存报价信息',d=>{const net=cents(d.get('net')),fee=cents(d.get('fee'));if(net===0)throw Error('净到账金额应大于0');const date=d.get('date');if(date<baseDate)throw Error('到账日期不能早于今天');state.cashOffer={...o,net,fee,eta:date,verified:d.get('verified')==='1'};closeModal();render();toast('报价已保存；尚未记入现金');});}
function fundModal(){
 const projected=[...state.confirmed,...state.estimated];
 const matchField=projected.length?'<details class="compact-fold" style="padding:0 0 8px"><summary>如果以前登记过预计到账，可在这里关联</summary><div class="field"><select id="matched" name="matched"><option value="">不用关联：新到账的一笔</option>'+projected.map(f=>'<option value="'+f.id+'">'+niceDate(f.date)+' · '+formatMoney(f.amount)+'（减少对应预测）</option>').join('')+'</select></div></details>':'';
 const typeField='<div class="field"><label for="origin">实际到账来源</label><select id="origin" name="origin"><option value="income">经营回款／非借款收入（此前未计入现金）</option><option value="own">其他自有账户资金（此前未计入总现金）</option><option value="bankloan">银行正规现金借款（新增负债）</option><option value="otherloan">其他合法借款（新增负债）</option></select><div class="fieldsmall">不能把信用卡普通消费额度、未到账报价、账户之间已经统计过的转账当作新增现金。</div></div>';
 modal('我收到钱了','只登记确实已经到账、且之前没有计入现金的钱。',typeField+
   moneyField('net','这次实际收到多少钱（元）','3000.00')+
   '<div id="loanFields" class="off">'+
   moneyField('debt','借款本金（元）','0.00','只在选择借款时填写；本金不能少于净到账。')+
   moneyField('fee','已核实的费用（元）','0.00','根据机构给出的实际费用填写。')+'</div>'+
   matchField+
   '<div class="warntext">公开演示不办理交易、不会保存数据。已还的消费额度不能当作实际现金。资金来源、手续费、到账日期均以真实凭证为准。</div>',
   '确认净到账',d=>{
     const net=cents(d.get('net')),debtAmt=cents(d.get('debt')),fee=cents(d.get('fee')),source=d.get('origin');
     const loan=source==='bankloan'||source==='otherloan';
     if(net<=0)throw Error('实际到账必须大于0');
     if(!['income','own','bankloan','otherloan'].includes(source))throw Error('请选择有效的资金来源');
     if(!loan&&debtAmt!==0)throw Error('非借款不能新增债务本金');
     if(loan&&(debtAmt<=0||debtAmt<net))throw Error('借款本金不得小于净到账金额');
     if(fee>0&&!loan)throw Error('非借款费用需单独核对，不通过此表增加借款费用');
     const matched=d.get('matched');
     if(matched){
       for(const key of ['confirmed','estimated']){
         const target=state[key].find(x=>x.id===matched);
         if(target){target.amount=Math.max(0,target.amount-net);state[key]=state[key].filter(x=>x.amount>0);break;}
       }
     }
     state.cash+=net;if(loan)state.newDebt+=debtAmt;
     state.events.push({type:loan?'loan':'income',source,net,debt:debtAmt,fee,date:baseDate});
     closeModal();render();toast('已登记到账 '+formatMoney(net)+'，接下来要还的钱已更新');
   });
 const sourceField=document.getElementById('origin'),loanFields=document.getElementById('loanFields');
 const updateFields=()=>{const on=['bankloan','otherloan'].includes(sourceField.value);loanFields.classList.toggle('off',!on);};
 sourceField.addEventListener('change',updateFields);updateFields();
}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>{r.innerHTML=''},2800);}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action],[data-tab],#reset');if(!t){if(e.target.classList.contains('modalbg'))closeModal();return}if(t.id==='reset'){if(confirm('重置所有演示操作，恢复虚构数据？'))seed();return}if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return;}switch(t.dataset.action){case'close':closeModal();break;case'repay':todayRepay(t.dataset.id);break;case'cash':cashEdit();break;case'plan':planOptions();break;case'newplan':newPlan(t.dataset.card||'',t.dataset.date||'');break;case'editplan':editPlan(t.dataset.id);break;case'offer':offerModal();break;case'futurefund':futureFundModal();break;case'fund':fundModal();break;case'verify-credit':verifyCredit(t.dataset.card);break;case'record-spend':recordSpend(t.dataset.card);break;case'edit-cycle':editCardCycle(t.dataset.card);break;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&bjToday()!==baseDate)render()});setInterval(()=>{if(bjToday()!==baseDate)render()},60000);
seed();
</script>
</body></html>
